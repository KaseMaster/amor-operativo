name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install markdownlint
        run: npm init -y && npm install markdownlint-cli
      - name: Lint markdown
        run: npx markdownlint "**/*.md" --ignore node_modules

  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate spec YAML
        run: |
          if [ -f spec/spec-v1.yaml ]; then
            python - <<'PY'
            import yaml, sys
            try:
                with open("spec/spec-v1.yaml", "r") as f:
                    data = yaml.safe_load(f)
                assert isinstance(data, dict), "spec-v1.yaml no parsea como mapping"
                print("spec-v1.yaml OK")
            except Exception as e:
                print(e)
                sys.exit(1)
            PY
          else
            echo "spec/spec-v1.yaml no encontrado; skip"
          fi

  auditor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run auditor tests
        run: |
          echo "tests del auditor: ejecutar el suite definido por el equipo de QA/AMO"
          echo "Este paso está preparado; la implementación concreta se define en paper/spec/"
