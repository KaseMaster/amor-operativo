name: publish

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install markdown-to-html tool
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
      - name: Build HTML from markdown
        run: |
          mkdir -p docs
          pandoc paper/paper.md -f markdown -t html5 -o docs/index.html
          pandoc paper/resumen_ejecutivo.md -f markdown -t html5 -o docs/resumen_ejecutivo.html
          pandoc paper/especificacion.md -f markdown -t html5 -o docs/especificacion.html
          pandoc paper/metricas.md -f markdown -t html5 -o docs/metricas.html
          pandoc paper/implementacion.md -f markdown -t html5 -o docs/implementacion.html
      - name: Version bump (manual gate)
        run: |
          echo "El bump de versión sucede en un commit posterior a la aprobación humana, no automáticamente."

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Set up Pages
        uses: actions/deploy-pages@v4
